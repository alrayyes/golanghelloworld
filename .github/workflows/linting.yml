name: Linting
on:
  push:

jobs:
  lint:
    name: Biome & markdown linting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Biome lint
        run: bun biome:lint .
      - name: markdown lint
        run: bun markdown:lint .
