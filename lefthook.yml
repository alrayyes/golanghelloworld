# pre-commit fixes what a tool can settle on its own and restages the result.
# The whole-tree checks, the build and the tests belong to pre-push, which
# never writes.
pre-commit:
  commands:
    # `run --fix` applies the gofmt formatter too, so there's no separate
    # `go fmt` step to fight with it over the same lines.
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --fix
      stage_fixed: true
    biome:
      glob: "*"
      run: bun run biome:format {staged_files}
      stage_fixed: true
    # Prettier decides the layout and markdownlint then judges what Prettier
    # produced. The other order has markdownlint fixing something Prettier is
    # about to overwrite.
    markdown:
      glob: "*.md"
      run: bun run prettier:format {staged_files} && bun run markdown:format {staged_files}
      stage_fixed: true
    hadolint:
      glob: "*Dockerfile"
      run: docker compose run --rm -T hadolint hadolint {staged_files}

pre-push:
  commands:
    biome:
      run: bun run biome:lint .
    prettier:
      run: bun run prettier:lint "**/*.md"
    markdown:
      run: bun run markdown:lint
    # These five are not installed by `bun install`, so a fresh clone would
    # otherwise fail the push with `command not found`. Skipping keeps the hook
    # usable before you've installed them; CI runs all five unconditionally, so
    # nothing gets through unchecked.
    yamlfmt:
      skip:
        - run: "! command -v yamlfmt"
      run: yamlfmt -lint
    yamllint:
      skip:
        - run: "! command -v yamllint"
      run: yamllint --strict .
    actionlint:
      skip:
        - run: "! command -v actionlint"
      run: actionlint
    typos:
      skip:
        - run: "! command -v typos"
      run: typos
    goreleaser:
      skip:
        - run: "! command -v goreleaser"
      run: goreleaser check
    hadolint:
      run: docker compose run --rm -T hadolint hadolint docker/hadolint/Dockerfile
    build:
      run: go mod download && go build -v ./...
    golangci-lint:
      run: golangci-lint run
    test:
      run: go test -cover ./...

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
