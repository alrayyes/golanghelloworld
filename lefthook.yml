pre-commit:
  commands:
    generate:
      run: go generate ./...
    fmt:
      run: go fmt ./...
    build:
      run: go mod download && go build -v ./...
    golangci-lint:
      run: golangci-lint run
    test:
      run: go test -cover ./...
    biome:
      glob: "*"
      run: bun run biome:format {staged_files}
      stage_fixed: true
    markdown:
      glob: "*.md"
      run: bun run markdown:format {staged_files}
      stage_fixed: true
    hadolint:
      glob: "*Dockerfile"
      run: docker compose run --rm -T hadolint hadolint {staged_files}

pre-push:
  commands:
    biome:
      run: bun run biome:lint .
    markdown:
      run: bun run markdown:lint .
    # These four are not installed by `bun install`, so a fresh clone would
    # otherwise fail the push with `command not found`. Skipping keeps the hook
    # usable before you've installed them; CI runs all four unconditionally, so
    # nothing gets through unchecked.
    yamlfmt:
      skip:
        - run: "! command -v yamlfmt"
      run: yamlfmt -lint
    yamllint:
      skip:
        - run: "! command -v yamllint"
      run: yamllint --strict .
    actionlint:
      skip:
        - run: "! command -v actionlint"
      run: actionlint
    typos:
      skip:
        - run: "! command -v typos"
      run: typos
    hadolint:
      run: docker compose run --rm -T hadolint hadolint docker/hadolint/Dockerfile
    build:
      run: go mod download && go build -v ./...
    golangci-lint:
      run: golangci-lint run
    test:
      run: go test -cover ./...

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
