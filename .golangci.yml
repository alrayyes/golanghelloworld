version: "2"
linters:
  default: all
  disable:
    - depguard
    - forbidigo
    # Deprecated since golangci-lint v2.12 in favour of gomodguard_v2, which
    # `default: all` enables in its place.
    - gomodguard
    - paralleltest
    - varnamelen
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
