pre-commit:
  commands:
    generate:
      run: go generate ./...
    fmt:
      run: go fmt ./...
    build:
      run: go mod download && go build -v ./...
    golangci-lint:
      run: golangci-lint run
    test:
      run: go test -cover ./...
    biome:
      glob: "*"
      run: bun run biome:format {staged_files}
      stage_fixed: true
    markdown:
      glob: "*.md"
      run: bun run markdown:format {staged_files}
      stage_fixed: true
    hadolint:
      glob: "*Dockerfile"
      run: docker compose run --rm -T hadolint hadolint {staged_files}

pre-push:
  commands:
    biome:
      run: bun run biome:lint .
    markdown:
      run: bun run markdown:lint .
    yamlfmt:
      run: yamlfmt -lint
    yamllint:
      run: yamllint --strict .
    actionlint:
      run: actionlint
    typos:
      run: typos
    hadolint:
      run: docker compose run --rm -T hadolint hadolint docker/hadolint/Dockerfile
    build:
      run: go mod download && go build -v ./...
    golangci-lint:
      run: golangci-lint run
    test:
      run: go test -cover ./...

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
