on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` here: it comes from release-please-config.json, and
      # the version comes from .release-please-manifest.json. The action picks
      # both files up by name.
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}

  # goreleaser hangs binaries on the release release-please just created, so it
  # lives here rather than in a workflow keyed on the tag. A tag pushed by an
  # action starts no further workflow when the default GITHUB_TOKEN is used, and
  # the first symptom is a release with nothing attached to it.
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
